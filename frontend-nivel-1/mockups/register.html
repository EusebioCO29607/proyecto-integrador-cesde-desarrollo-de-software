<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotApp - Crear cuenta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <h1 class="logo"><span class="logo-not">Not</span><span class="logo-app">App</span></h1>
        <p>Sistema de Gestión Académica</p>
      </div>

      <div id="registerError" class="error-msg" style="display:none;"></div>
      <div id="registerSuccess" class="error-msg" style="display:none; background:#f0fff0; border-color:#aaddaa; color:#226622;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Nombre completo</label>
          <input
            type="text"
            id="fullName"
            placeholder="Ej: Ana Martínez"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            placeholder="usuario@notapp.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="role">Rol</label>
          <select id="role">
            <option value="admin">Administrador</option>
            <option value="teacher">Formador</option>
            <option value="student">Estudiante</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Mínimo 6 caracteres"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Repita su contraseña"
            required
          >
        </div>

        <button type="submit" class="login-btn">Crear cuenta</button>
      </form>

      <div class="login-footer">
        <p>¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a></p>
      </div>

    </div>
  </div>

  <script src="/frontend-nivel-1/inicio-sesion/register.js"></script>
</body>
</html>
