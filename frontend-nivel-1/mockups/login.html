<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotApp - Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <h1 class="logo"><span class="logo-not">Not</span><span class="logo-app">App</span></h1>
        <p>Sistema de Gestión Académica</p>
      </div>

      <div id="loginError" class="error-msg" style="display:none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="usuario@notapp.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingrese su contraseña"
            required
          >
        </div>

        <div class="form-group">
          <label for="role">Tipo de rol</label>
          <select id="role" name="role">
            <option value="">-- Seleccione su rol --</option>
            <option value="admin">Administrador</option>
            <option value="teacher">Formador</option>
            <option value="student">Estudiante</option>
          </select>
        </div>

        <button type="submit" class="login-btn">Iniciar Sesión</button>
      </form>

      <div class="login-footer">
        <p><a href="#">Olvidé mi contraseña</a></p>
        <p style="margin-top: 8px;">
          ¿No tienes cuenta? <a href="register.html">Crear cuenta</a>
        </p>
      </div>

    </div>
  </div>

  <script src="/frontend-nivel-1/inicio-sesion/login.js"></script>
</body>
</html>
